dataset:
  name: nf_uq_nids_v2
  role: cross_domain_robustness
  raw_path: data/raw/nf_uq_nids_v2
  processed_path: data/processed/nf_uq_nids_v2
  official_page: https://www.cyber.uq.edu.au/project/machine-learning-based-nids-datasets
  expected_records: 75987976
  expected_benign_records: 25165295
  expected_attack_records: 50822681
  download_note: >
    The official UQ RDM file pages are browser/application mediated, but the
    app calls https://api.rdm.uq.edu.au/datasets/{uuid}/download to obtain a
    temporary signed S3 URL. Stage the extracted NF-UQ-NIDS-v2 CSV under
    raw_path. The loader is chunked because the full merged corpus is too large
    for ordinary in-memory processing.

splits:
  strategy: leave_one_source_domain_out
  seed: 42

source_domains:
  - NF-UNSW-NB15-v2
  - NF-ToN-IoT-v2
  - NF-BoT-IoT-v2
  - NF-CSE-CIC-IDS2018-v2

